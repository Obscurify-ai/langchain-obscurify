[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-obscurify"
version = "0.1.1"
description = "LangChain chat model for Obscurify.ai, a private AI API (OpenAI-compatible)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<4.0"
authors = [{ name = "Obscurify.ai", email = "contact@obscurify.ai" }]
keywords = ["langchain", "obscurify", "llm", "privacy", "openai-compatible"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain-core>=1.0.0,<2.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
]

[project.urls]
Homepage = "https://obscurify.ai/?utm_source=langchain-obscurify"
Documentation = "https://github.com/Obscurify-ai/langchain-obscurify#readme"
Repository = "https://github.com/Obscurify-ai/langchain-obscurify"
Issues = "https://github.com/Obscurify-ai/langchain-obscurify/issues"
"API docs" = "https://obscurify.ai/api-docs"

[dependency-groups]
test = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23",
    "pytest-socket>=0.7",
    "langchain-tests>=1.0.0,<2.0.0",
    "langchain>=1.0.0,<2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["langchain_obscurify"]

[tool.hatch.build.targets.sdist]
include = ["langchain_obscurify", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["compile: placeholder"]
